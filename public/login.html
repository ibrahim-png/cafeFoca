<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cafe Foca Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;

      background:
        linear-gradient(
          -45deg,
          #667eea,
          #764ba2,
          #f093fb,
          #f5576c
        );

      background-size:400% 400%;

      animation:
        gradientMove 15s ease infinite;
    }

    @keyframes gradientMove{
      0%{
        background-position:0% 50%;
      }

      50%{
        background-position:100% 50%;
      }

      100%{
        background-position:0% 50%;
      }
    }

    .wave{
      position:absolute;

      width:200%;
      height:200%;

      background:
        rgba(255,255,255,0.03);

      border-radius:40%;

      animation:
        waveRotate 25s linear infinite;
    }

    .wave.one{
      top:-70%;
      left:-50%;
    }

    .wave.two{
      bottom:-70%;
      right:-50%;

      animation-duration:35s;
    }

    @keyframes waveRotate{
      from{
        transform:rotate(0deg);
      }

      to{
        transform:rotate(360deg);
      }
    }

    .login-container{
      width:100%;
      max-width:430px;

      position:relative;
      z-index:10;

      padding:20px;
    }

    .login-card{

      background:
        rgba(255,255,255,0.14);

      backdrop-filter:blur(25px);
      -webkit-backdrop-filter:blur(25px);

      border:
        1px solid rgba(255,255,255,0.18);

      border-radius:30px;

      padding:46px;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.25);

      transition:0.3s;
    }

    .login-card:hover{
      transform:
        translateY(-4px);
    }

    .login-header{
      text-align:center;
      margin-bottom:36px;
    }

    .logo{
      width:120px;
      height:120px;

      border-radius:50%;

      background:white;

      color:#e11d1d;

      font-size:70px;
      font-weight:bold;

      display:flex;
      align-items:center;
      justify-content:center;

      margin:0 auto 24px;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.2);

      transition:0.25s;
    }

    .logo:hover{
      transform:scale(1.05);
    }

    .login-header h2{
      color:white;

      font-size:36px;
      font-weight:800;

      margin-bottom:10px;

      letter-spacing:-1px;
    }

    .login-header p{
      color:
        rgba(255,255,255,0.75);

      font-size:15px;
    }

    .form-group{
      margin-bottom:22px;
    }

    .input-container{
      position:relative;
    }

    .input-bg{
      position:absolute;
      inset:0;

      border-radius:18px;

      background:
        rgba(255,255,255,0.10);

      border:
        1px solid rgba(255,255,255,0.18);

      transition:0.25s;
    }

    .input-container:focus-within .input-bg{

      background:
        rgba(255,255,255,0.16);

      border-color:
        rgba(255,255,255,0.35);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.12);
    }

    input{
      width:100%;

      background:transparent;

      border:none;

      outline:none;

      color:white;

      font-size:16px;

      padding:
        24px 22px 14px;

      position:relative;
      z-index:2;
    }

    input::placeholder{
      color:transparent;
    }

    label{
      position:absolute;

      left:22px;
      top:50%;

      transform:translateY(-50%);

      color:
        rgba(255,255,255,0.65);

      font-size:16px;

      pointer-events:none;

      transition:0.25s;

      z-index:3;
    }

    input:focus + label,
    input:not(:placeholder-shown) + label{

      top:10px;

      transform:none;

      font-size:12px;

      color:white;
    }

    .login-button{

      width:100%;

      height:58px;

      border:none;

      border-radius:18px;

      cursor:pointer;

      color:white;

      font-size:16px;
      font-weight:700;

      background:
        linear-gradient(
          135deg,
          #ffffff20,
          #ffffff10
        );

      border:
        1px solid rgba(255,255,255,0.25);

      backdrop-filter:blur(12px);

      transition:0.25s;

      margin-top:8px;
    }

    .login-button:hover{

      transform:
        translateY(-2px);

      background:
        linear-gradient(
          135deg,
          #ffffff35,
          #ffffff20
        );
    }

    .login-button:disabled{
      opacity:0.7;
      cursor:not-allowed;
    }

    #message{

      min-height:24px;

      margin-top:18px;

      text-align:center;

      color:#ffe0e0;

      font-size:14px;
      font-weight:600;
    }

    .footer{

      text-align:center;

      margin-top:28px;

      color:
        rgba(255,255,255,0.60);

      font-size:13px;
    }

    @media(max-width:480px){

      .login-card{
        padding:34px 26px;
      }

      .logo{
        width:100px;
        height:100px;

        font-size:58px;
      }

      .login-header h2{
        font-size:30px;
      }
    }

  </style>
</head>

<body>

  <div class="wave one"></div>
  <div class="wave two"></div>

  <div class="login-container">

    <div class="login-card">

      <div class="login-header">

        <div class="logo">✦</div>

        <h2>Cafe Foca</h2>

        <p>
          Personel giriş ekranı
        </p>

      </div>

      <div class="form-group">

        <div class="input-container">

          <div class="input-bg"></div>

          <input
            id="username"
            type="text"
            placeholder="Kullanıcı adı"
            autocomplete="username"
          >

          <label for="username">
            Kullanıcı adı
          </label>

        </div>

      </div>

      <div class="form-group">

        <div class="input-container">

          <div class="input-bg"></div>

          <input
            id="password"
            type="password"
            placeholder="Şifre"
            autocomplete="current-password"
          >

          <label for="password">
            Şifre
          </label>

        </div>

      </div>

      <button
        id="loginBtn"
        class="login-button"
        onclick="login()"
      >
        Giriş Yap
      </button>

      <div id="message"></div>

    </div>

  </div>

  <script>

    async function login(){

      const username =
        document
          .getElementById("username")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const message =
        document
          .getElementById("message");

      const button =
        document
          .getElementById("loginBtn");

      message.innerText = "";

      if(!username || !password){

        message.innerText =
          "Kullanıcı adı ve şifre zorunlu.";

        return;
      }

      button.disabled = true;

      button.innerText =
        "Giriş yapılıyor...";

      try{

        const response =
          await fetch("/api/login",{

            method:"POST",

            headers:{
              "Content-Type":"application/json"
            },

            credentials:"include",

            body:JSON.stringify({
              username,
              password
            })

          });

        const data =
          await response.json();

        if(response.ok){

          window.location.href =
            "/home";

        }else{

          message.innerText =
            data.message ||
            "Giriş başarısız.";

        }

      }catch(err){

        message.innerText =
          "Sunucu bağlantı hatası.";

      }finally{

        button.disabled = false;

        button.innerText =
          "Giriş Yap";
      }
    }

    document.addEventListener(
      "keydown",
      function(e){

        if(e.key === "Enter"){
          login();
        }

      }
    );

  </script>

</body>
</html>
