<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Focalina Login</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      min-height:100vh;
      font-family:Inter,Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:#111827;
    }

.bg-video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;

  filter:
    blur(2px)
    brightness(.78)
    saturate(1.08);

  transform:scale(1.03);

  z-index:-3;
}

.overlay{
  position:fixed;
  inset:0;

  background:
    linear-gradient(
      135deg,
      rgba(15,23,42,.18),
      rgba(88,28,135,.14),
      rgba(127,29,29,.10)
    );

  z-index:-2;
}

    .login-container{
      width:100%;
      max-width:430px;
      padding:20px;
      z-index:10;
    }

    .login-card{
      background:rgba(255,255,255,.14);
      <!--backdrop-filter:blur(25px);-->
      -webkit-backdrop-filter:blur(25px);
      border:1px solid rgba(255,255,255,.2);
      border-radius:30px;
      padding:46px;
      box-shadow:0 25px 70px rgba(0,0,0,.35);
    }

    .login-header{text-align:center;margin-bottom:36px}

    .logo{
      width:120px;
      height:120px;
      border-radius:50%;
      background:white;
      color:#e11d1d;
      font-size:70px;
      font-weight:bold;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto 24px;
      box-shadow:0 15px 35px rgba(0,0,0,.25);
    }

    h2{
      color:white;
      font-size:36px;
      font-weight:800;
      margin-bottom:10px;
    }

    p{color:rgba(255,255,255,.75);font-size:15px}

    .form-group{margin-bottom:22px}

    .input-container{position:relative}

    .input-bg{
      position:absolute;
      inset:0;
      border-radius:18px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.2);
    }

    input{
      width:100%;
      background:transparent;
      border:none;
      outline:none;
      color:white;
      font-size:16px;
      padding:24px 22px 14px;
      position:relative;
      z-index:2;
    }

    input::placeholder{color:transparent}

    label{
      position:absolute;
      left:22px;
      top:50%;
      transform:translateY(-50%);
      color:rgba(255,255,255,.7);
      font-size:16px;
      pointer-events:none;
      transition:.25s;
      z-index:3;
    }

    input:focus + label,
    input:not(:placeholder-shown) + label{
      top:10px;
      transform:none;
      font-size:12px;
      color:white;
    }

    button{
      width:100%;
      height:58px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      color:white;
      font-size:16px;
      font-weight:700;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.25);
      transition:.25s;
      margin-top:8px;
    }

    button:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}
    button:disabled{opacity:.7;cursor:not-allowed}

    #message{
      min-height:24px;
      margin-top:18px;
      text-align:center;
      color:#ffe0e0;
      font-size:14px;
      font-weight:600;
    }

    .footer{
      text-align:center;
      margin-top:28px;
      color:rgba(255,255,255,.6);
      font-size:13px;
    }
  </style>
</head>

<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="/login-bg.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="login-container">
    <div class="login-card">

      <div class="login-header">
        <div class="logo">✦</div>
        <h2>Focalina</h2>
        <p>Personel giriş ekranı</p>
      </div>

      <div class="form-group">
        <div class="input-container">
          <div class="input-bg"></div>
          <input id="username" type="text" placeholder="Kullanıcı adı" autocomplete="username">
          <label for="username">Kullanıcı adı</label>
        </div>
      </div>

      <div class="form-group">
        <div class="input-container">
          <div class="input-bg"></div>
          <input id="password" type="password" placeholder="Şifre" autocomplete="current-password">
          <label for="password">Şifre</label>
        </div>
      </div>

      <button id="loginBtn" onclick="login()">Giriş Yap</button>

      <div id="message"></div>

      <div class="footer">Yetkisiz erişimler engellenir</div>

    </div>
  </div>

  <script>
    async function login(){
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");
      const button = document.getElementById("loginBtn");

      message.innerText = "";

      if(!username || !password){
        message.innerText = "Kullanıcı adı ve şifre zorunlu.";
        return;
      }

      button.disabled = true;
      button.innerText = "Giriş yapılıyor...";

      try{
        const response = await fetch("/api/login", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          credentials:"include",
          body:JSON.stringify({username,password})
        });

        const data = await response.json();

        if(response.ok){
          window.location.href = "/home";
        }else{
          message.innerText = data.message || "Giriş başarısız.";
        }
      }catch(err){
        message.innerText = "Sunucu bağlantı hatası.";
      }finally{
        button.disabled = false;
        button.innerText = "Giriş Yap";
      }
    }

    document.addEventListener("keydown", e => {
      if(e.key === "Enter") login();
    });
  </script>

</body>
</html>
